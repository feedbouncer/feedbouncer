# FeedBouncer LOCAL DEVELOPMENT stack. Not a production deployment.
#   Start:  cp .env.example .env && docker compose up
#   Stop:   docker compose down          (keeps the database)
#   Reset:  docker compose down -v       (DELETES the database volume)
# See README.md, "Local stack with Docker Compose".
name: feedbouncer

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is not set - copy .env.example to .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is not set - copy .env.example to .env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set - copy .env.example to .env}@redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Observability (docs/operations/observability.md). Traces stay off unless
  # OTEL_TRACES_EXPORTER=otlp. The metrics listeners bind inside the container
  # only; no metrics port is published to the host.
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  METRICS_HOST: ${METRICS_HOST:-0.0.0.0}

# Only the services that touch credentials get the encryption keys (not migrate).
x-secrets-env: &secrets-env
  FB_ENV: ${FB_ENV:-production}
  FB_ENCRYPTION_KEYS: ${FB_ENCRYPTION_KEYS:?FB_ENCRYPTION_KEYS is not set - copy .env.example to .env}
  FB_ENCRYPTION_ACTIVE_KEY_ID: ${FB_ENCRYPTION_ACTIVE_KEY_ID:?FB_ENCRYPTION_ACTIVE_KEY_ID is not set - copy .env.example to .env}

# Slack and email alerts (docs/operations/alerts.md). Empty means off or the default.
x-alerts-env: &alerts-env
  ALERT_CHANNELS: ${ALERT_CHANNELS:-}
  ALERT_MAX_PER_WORKSPACE_PER_HOUR: ${ALERT_MAX_PER_WORKSPACE_PER_HOUR:-}

# Facebook Pages connector (docs/connectors/facebook.md). No defaults: with
# FACEBOOK_APP_ID empty the connector, its webhook route and its jobs are off.
# The api and the worker must share the app id and secret.
x-facebook-env: &facebook-env
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
  FACEBOOK_WEBHOOK_VERIFY_TOKEN: ${FACEBOOK_WEBHOOK_VERIFY_TOKEN:-}
  FACEBOOK_GRAPH_API_VERSION: ${FACEBOOK_GRAPH_API_VERSION:-}
  # Instagram connector (docs/connectors/instagram.md). No default: unset means off.
  # It runs on the Facebook Meta app above, so it needs the FACEBOOK_* variables.
  INSTAGRAM_CONNECTOR_ENABLED: ${INSTAGRAM_CONNECTOR_ENABLED:-}
  # Meta Ads connector (docs/connectors/meta-ads.md). No default: unset means off.
  # It also runs on the Facebook Meta app, so it needs the FACEBOOK_* variables.
  META_ADS_CONNECTOR_ENABLED: ${META_ADS_CONNECTOR_ENABLED:-}
  META_ADS_ACTIVE_STATUSES: ${META_ADS_ACTIVE_STATUSES:-}

x-node-service: &node-service
  init: true
  restart: on-failure:3
  stop_grace_period: 15s
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set - copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      # TCP (-h 127.0.0.1), not the Unix socket: during first-boot init the
      # image runs a temporary socket-only server that would report "ready"
      # and then restart under our clients.
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    # noeviction is required by BullMQ. No persistence: queued dev jobs are
    # disposable. The password is visible in `docker inspect` (dev only).
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is not set - copy .env.example to .env}
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set - copy .env.example to .env}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -h 127.0.0.1 ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 256M

  mailpit:
    # Dev-only SMTP sink. Every email the stack sends lands here; nothing leaves the machine.
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    ports:
      - '${FB_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_HOST_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 128M

  migrate:
    # One-shot: applies pending Prisma migrations, then exits 0. api and
    # worker wait for it, so they never race the schema. Safe to re-run.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    working_dir: /repo/packages/db
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    restart: 'no'
    environment:
      <<: *backend-env
    volumes:
      - ./packages/db/prisma:/repo/packages/db/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      <<: [*backend-env, *secrets-env, *facebook-env, *alerts-env]
      # tsx watch gets no file events through Docker Desktop bind mounts.
      CHOKIDAR_USEPOLLING: '1'
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is not set - copy .env.example to .env}
      # Browsers reach the API through the web app, so this is the only origin
      # allowed to send state-changing requests.
      PUBLIC_WEB_URL: http://localhost:${WEB_HOST_PORT:-3000}
      SMTP_URL: smtp://mailpit:1025
      # The web app's server-side proxy is one hop in front of the API.
      TRUST_PROXY_HOPS: '1'
      PUBLIC_API_RATE_LIMIT_PER_MINUTE: ${PUBLIC_API_RATE_LIMIT_PER_MINUTE:-}
      RULE_PROPOSAL_TTL_HOURS: ${RULE_PROPOSAL_TTL_HOURS:-}
      MODERATION_CHECK_TIMEOUT_MS: ${MODERATION_CHECK_TIMEOUT_MS:-}
      WEBHOOK_ALLOWED_PRIVATE_CIDRS: ${WEBHOOK_ALLOWED_PRIVATE_CIDRS:-}
      # Shown in the classifier settings; the key is held by the worker only.
      CLASSIFIER_PROVIDER: ${CLASSIFIER_PROVIDER:-}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      # Subject exports are written by the worker; the api only serves downloads from here.
      PRIVACY_EXPORT_DIR: /var/lib/feedbouncer/privacy-exports
      # Free ad-comment scan; empty means the default (docs/self-hosting/meta-app.md).
      SCAN_TOOL_ENABLED: ${SCAN_TOOL_ENABLED:-}
      SCAN_MAX_COMMENTS: ${SCAN_MAX_COMMENTS:-}
      SCAN_RETENTION_DAYS: ${SCAN_RETENTION_DAYS:-}
      SCAN_WORKER_CONCURRENCY: ${SCAN_WORKER_CONCURRENCY:-}
    ports:
      - '${FB_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-3001}:3001'
    volumes:
      - privacy-exports:/var/lib/feedbouncer/privacy-exports:ro
      - ./apps/api/src:/repo/apps/api/src:ro
      - ./packages/service-runtime/src:/repo/packages/service-runtime/src:ro
      - ./packages/authz/src:/repo/packages/authz/src:ro
      - ./packages/privacy/src:/repo/packages/privacy/src:ro
      - ./packages/db/src:/repo/packages/db/src:ro
      - ./packages/mailer/src:/repo/packages/mailer/src:ro
      - ./packages/secrets/src:/repo/packages/secrets/src:ro
      - ./packages/actions/src:/repo/packages/actions/src:ro
      - ./packages/alerts/src:/repo/packages/alerts/src:ro
      - ./packages/ai/src:/repo/packages/ai/src:ro
      - ./packages/classifier/src:/repo/packages/classifier/src:ro
      - ./packages/comments/src:/repo/packages/comments/src:ro
      - ./packages/moderation-check/src:/repo/packages/moderation-check/src:ro
      - ./packages/moderation-contract/src:/repo/packages/moderation-contract/src:ro
      - ./packages/policies/src:/repo/packages/policies/src:ro
      - ./packages/public-api/src:/repo/packages/public-api/src:ro
      - ./packages/reports/src:/repo/packages/reports/src:ro
      - ./packages/rules/src:/repo/packages/rules/src:ro
      - ./packages/scan/src:/repo/packages/scan/src:ro
      - ./packages/webhooks/src:/repo/packages/webhooks/src:ro
      - ./packages/connector-facebook/src:/repo/packages/connector-facebook/src:ro
      - ./packages/connector-instagram/src:/repo/packages/connector-instagram/src:ro
      - ./packages/connector-meta-ads/src:/repo/packages/connector-meta-ads/src:ro
      - ./packages/connectors/src:/repo/packages/connectors/src:ro
      - ./packages/jobs/src:/repo/packages/jobs/src:ro
      - ./packages/observability/src:/repo/packages/observability/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    environment:
      <<: [*backend-env, *secrets-env, *facebook-env, *alerts-env]
      CHOKIDAR_USEPOLLING: '1'
      # Reconnect notices go to the dev mail sink; links and the OAuth redirect
      # URI are built from PUBLIC_WEB_URL, which must match the api's.
      SMTP_URL: smtp://mailpit:1025
      PUBLIC_WEB_URL: http://localhost:${WEB_HOST_PORT:-3000}
      MAIL_FROM: ${MAIL_FROM:-}
      ALERT_EMAIL_MAX_PER_MINUTE: ${ALERT_EMAIL_MAX_PER_MINUTE:-}
      # Weekly email report: on|off, empty means off.
      WEEKLY_REPORTS: ${WEEKLY_REPORTS:-}
      WEBHOOK_ALLOWED_PRIVATE_CIDRS: ${WEBHOOK_ALLOWED_PRIVATE_CIDRS:-}
      WEBHOOK_DISPATCH_CONCURRENCY: ${WEBHOOK_DISPATCH_CONCURRENCY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      MODERATION_CHECK_CONCURRENCY: ${MODERATION_CHECK_CONCURRENCY:-}
      # Empty means "use the default" (see docs/operations/job-queue.md).
      JOB_QUEUE_PREFIX: ${JOB_QUEUE_PREFIX:-}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-}
      JOB_BACKOFF_BASE_MS: ${JOB_BACKOFF_BASE_MS:-}
      JOB_BACKOFF_MAX_MS: ${JOB_BACKOFF_MAX_MS:-}
      JOB_DLQ_RETENTION_DAYS: ${JOB_DLQ_RETENTION_DAYS:-}
      JOB_DEDUP_WINDOW_DAYS: ${JOB_DEDUP_WINDOW_DAYS:-}
      JOB_CONCURRENCY_LANE_CLASSIFY: ${JOB_CONCURRENCY_LANE_CLASSIFY:-}
      # Comment classifier; empty provider means disabled (docs/operations/job-queue.md).
      CLASSIFIER_PROVIDER: ${CLASSIFIER_PROVIDER:-}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-}
      CLASSIFIER_API_KEY: ${CLASSIFIER_API_KEY:-}
      CLASSIFIER_BASE_URL: ${CLASSIFIER_BASE_URL:-}
      CLASSIFIER_ALLOW_HTTP: ${CLASSIFIER_ALLOW_HTTP:-}
      CLASSIFIER_TIMEOUT_MS: ${CLASSIFIER_TIMEOUT_MS:-}
      CLASSIFIER_LANGUAGES: ${CLASSIFIER_LANGUAGES:-}
      CLASSIFIER_BRAND_MAX_IN_FLIGHT: ${CLASSIFIER_BRAND_MAX_IN_FLIGHT:-}
      CLASSIFIER_MAX_WAIT_MINUTES: ${CLASSIFIER_MAX_WAIT_MINUTES:-}
      # Ad discovery and ad comment polling; empty means the default (docs/connectors/meta-ads.md).
      AD_POLL_INTERVAL_SEC: ${AD_POLL_INTERVAL_SEC:-}
      AD_DISCOVERY_INTERVAL_SEC: ${AD_DISCOVERY_INTERVAL_SEC:-}
      AD_RETIREMENT_GRACE_DAYS: ${AD_RETIREMENT_GRACE_DAYS:-}
      AD_POLL_MAX_SOURCES_PER_JOB: ${AD_POLL_MAX_SOURCES_PER_JOB:-}
      AD_SOURCE_UNAVAILABLE_RETRY_SEC: ${AD_SOURCE_UNAVAILABLE_RETRY_SEC:-}
      AD_IG_DEEP_SCAN_INTERVAL_SEC: ${AD_IG_DEEP_SCAN_INTERVAL_SEC:-}
      AD_SCHEDULER_TICK_SEC: ${AD_SCHEDULER_TICK_SEC:-}
      AD_SCHEDULER_MAX_CONNECTIONS_PER_TICK: ${AD_SCHEDULER_MAX_CONNECTIONS_PER_TICK:-}
      # Free ad-comment scan; empty means the default (docs/self-hosting/meta-app.md).
      SCAN_TOOL_ENABLED: ${SCAN_TOOL_ENABLED:-}
      SCAN_MAX_COMMENTS: ${SCAN_MAX_COMMENTS:-}
      SCAN_RETENTION_DAYS: ${SCAN_RETENTION_DAYS:-}
      SCAN_WORKER_CONCURRENCY: ${SCAN_WORKER_CONCURRENCY:-}
      # Data retention (docs/operations/data-retention.md). Each period is a number of days
      # (1-36500) or "forever"; forever keeps today's behaviour. The tuning values may be empty.
      RETENTION_COMMENTS_DAYS: ${RETENTION_COMMENTS_DAYS:-forever}
      RETENTION_DECISIONS_DAYS: ${RETENTION_DECISIONS_DAYS:-forever}
      RETENTION_PREVIEWS_DAYS: ${RETENTION_PREVIEWS_DAYS:-forever}
      RETENTION_OPERATIONAL_DAYS: ${RETENTION_OPERATIONAL_DAYS:-forever}
      RETENTION_AUDIT_DAYS: ${RETENTION_AUDIT_DAYS:-forever}
      RETENTION_PURGE_INTERVAL_MINUTES: ${RETENTION_PURGE_INTERVAL_MINUTES:-}
      RETENTION_BATCH_SIZE: ${RETENTION_BATCH_SIZE:-}
      RETENTION_CONFIRM_ABOVE: ${RETENTION_CONFIRM_ABOVE:-}
      RETENTION_MAX_RUN_MINUTES: ${RETENTION_MAX_RUN_MINUTES:-}
      # Subject export and erasure requests (docs/operations/subject-requests.md). The worker writes
      # exports to the shared volume; the api only serves them from there, read-only.
      PRIVACY_EXPORT_DIR: /var/lib/feedbouncer/privacy-exports
      PRIVACY_EXPORT_TTL_HOURS: ${PRIVACY_EXPORT_TTL_HOURS:-}
      PRIVACY_REQUEST_CONCURRENCY: ${PRIVACY_REQUEST_CONCURRENCY:-}
    # In-flight jobs finish on shutdown, bounded by the handler timeout (60 s default).
    # Keep this above that timeout plus margin so a restart does not kill a job mid-effect.
    stop_grace_period: 100s
    # No ports: the worker is internal. Scale with --scale worker=N.
    volumes:
      - privacy-exports:/var/lib/feedbouncer/privacy-exports
      - ./apps/worker/src:/repo/apps/worker/src:ro
      - ./packages/actions/src:/repo/packages/actions/src:ro
      - ./packages/alerts/src:/repo/packages/alerts/src:ro
      - ./packages/authz/src:/repo/packages/authz/src:ro
      - ./packages/ai/src:/repo/packages/ai/src:ro
      - ./packages/classifier/src:/repo/packages/classifier/src:ro
      - ./packages/comments/src:/repo/packages/comments/src:ro
      - ./packages/moderation-check/src:/repo/packages/moderation-check/src:ro
      - ./packages/moderation-contract/src:/repo/packages/moderation-contract/src:ro
      - ./packages/connector-facebook/src:/repo/packages/connector-facebook/src:ro
      - ./packages/connector-instagram/src:/repo/packages/connector-instagram/src:ro
      - ./packages/connector-meta-ads/src:/repo/packages/connector-meta-ads/src:ro
      - ./packages/connectors/src:/repo/packages/connectors/src:ro
      - ./packages/jobs/src:/repo/packages/jobs/src:ro
      - ./packages/mailer/src:/repo/packages/mailer/src:ro
      - ./packages/observability/src:/repo/packages/observability/src:ro
      - ./packages/policies/src:/repo/packages/policies/src:ro
      - ./packages/privacy/src:/repo/packages/privacy/src:ro
      - ./packages/public-api/src:/repo/packages/public-api/src:ro
      - ./packages/evaluation/src:/repo/packages/evaluation/src:ro
      - ./packages/reports/src:/repo/packages/reports/src:ro
      - ./packages/rules/src:/repo/packages/rules/src:ro
      - ./packages/scan/src:/repo/packages/scan/src:ro
      - ./packages/service-runtime/src:/repo/packages/service-runtime/src:ro
      - ./packages/db/src:/repo/packages/db/src:ro
      - ./packages/secrets/src:/repo/packages/secrets/src:ro
      - ./packages/webhooks/src:/repo/packages/webhooks/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_INTERNAL_URL: http://api:3001
      NEXT_TELEMETRY_DISABLED: '1'
      # Poll interval in ms for next dev's (Turbopack) file watcher. 0 = native events.
      WEB_WATCH_POLL_MS: ${WEB_WATCH_POLL_MS:-0}
    ports:
      - '${FB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000'
    volumes:
      - ./apps/web/src:/repo/apps/web/src:ro
      - ./packages/actions/src:/repo/packages/actions/src:ro
      - ./packages/ai/src:/repo/packages/ai/src:ro
      - ./packages/alerts/src:/repo/packages/alerts/src:ro
      - ./packages/authz/src:/repo/packages/authz/src:ro
      - ./packages/classifier/src:/repo/packages/classifier/src:ro
      - ./packages/comments/src:/repo/packages/comments/src:ro
      - ./packages/connectors/src:/repo/packages/connectors/src:ro
      - ./packages/db/src:/repo/packages/db/src:ro
      - ./packages/jobs/src:/repo/packages/jobs/src:ro
      - ./packages/mailer/src:/repo/packages/mailer/src:ro
      - ./packages/reports/src:/repo/packages/reports/src:ro
      - ./packages/rules/src:/repo/packages/rules/src:ro
      - ./packages/secrets/src:/repo/packages/secrets/src:ro
      - ./packages/service-runtime/src:/repo/packages/service-runtime/src:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      # next dev compiles the route on first request.
      start_period: 90s
      start_interval: 2s
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  pgdata:
  privacy-exports:
