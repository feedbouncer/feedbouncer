# FeedBouncer LOCAL DEVELOPMENT stack. Not a production deployment.
#   Start:  cp .env.example .env && docker compose up
#   Stop:   docker compose down          (keeps the database)
#   Reset:  docker compose down -v       (DELETES the database volume)
# See README.md, "Local stack with Docker Compose".
name: feedbouncer

x-backend-env: &backend-env
  DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is not set - copy .env.example to .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is not set - copy .env.example to .env}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is not set - copy .env.example to .env}@redis:6379/0
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-node-service: &node-service
  init: true
  restart: on-failure:3
  stop_grace_period: 15s
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set - copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set - copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    healthcheck:
      # TCP (-h 127.0.0.1), not the Unix socket: during first-boot init the
      # image runs a temporary socket-only server that would report "ready"
      # and then restart under our clients.
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    # noeviction is required by BullMQ. No persistence: queued dev jobs are
    # disposable. The password is visible in `docker inspect` (dev only).
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is not set - copy .env.example to .env}
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 200mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is not set - copy .env.example to .env}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -h 127.0.0.1 ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 256M

  mailpit:
    # Dev-only SMTP sink. Every email the stack sends lands here; nothing leaves the machine.
    image: axllent/mailpit:v1.31.5@sha256:eee7db19e7518ffe47d9b38e46fab655a4edf7e6cb5e664d1b5fde6c9dc49010
    restart: unless-stopped
    ports:
      - '${FB_BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_HOST_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 128M

  migrate:
    # One-shot: applies pending Prisma migrations, then exits 0. api and
    # worker wait for it, so they never race the schema. Safe to re-run.
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    working_dir: /repo/packages/db
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    restart: 'no'
    environment:
      <<: *backend-env
    volumes:
      - ./packages/db/prisma:/repo/packages/db/prisma:ro
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    environment:
      <<: *backend-env
      # tsx watch gets no file events through Docker Desktop bind mounts.
      CHOKIDAR_USEPOLLING: '1'
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is not set - copy .env.example to .env}
      # Browsers reach the API through the web app, so this is the only origin
      # allowed to send state-changing requests.
      PUBLIC_WEB_URL: http://localhost:${WEB_HOST_PORT:-3000}
      SMTP_URL: smtp://mailpit:1025
      # The web app's server-side proxy is one hop in front of the API.
      TRUST_PROXY_HOPS: '1'
    ports:
      - '${FB_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-3001}:3001'
    volumes:
      - ./apps/api/src:/repo/apps/api/src:ro
      - ./packages/service-runtime/src:/repo/packages/service-runtime/src:ro
      - ./packages/db/src:/repo/packages/db/src:ro
      - ./packages/mailer/src:/repo/packages/mailer/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      target: dev
    environment:
      <<: *backend-env
      CHOKIDAR_USEPOLLING: '1'
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    # No ports: the worker is internal. Scale with --scale worker=N.
    volumes:
      - ./apps/worker/src:/repo/apps/worker/src:ro
      - ./packages/service-runtime/src:/repo/packages/service-runtime/src:ro
      - ./packages/db/src:/repo/packages/db/src:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    <<: *node-service
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    environment:
      API_INTERNAL_URL: http://api:3001
      NEXT_TELEMETRY_DISABLED: '1'
      # Poll interval in ms for next dev's (Turbopack) file watcher. 0 = native events.
      WEB_WATCH_POLL_MS: ${WEB_WATCH_POLL_MS:-0}
    ports:
      - '${FB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000'
    volumes:
      - ./apps/web/src:/repo/apps/web/src:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      # next dev compiles the route on first request.
      start_period: 90s
      start_interval: 2s
    deploy:
      resources:
        limits:
          memory: 1536M

volumes:
  pgdata:
