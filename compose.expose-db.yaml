# Opt-in: publish Postgres and Redis on THIS machine only (127.0.0.1).
#   docker compose -f compose.yaml -f compose.expose-db.yaml up
# or set COMPOSE_FILE=compose.yaml:compose.expose-db.yaml in .env
services:
  postgres:
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432'
  redis:
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379'
