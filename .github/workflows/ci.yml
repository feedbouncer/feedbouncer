# CI: required checks are "Typecheck", "Test", "Docker build", "Compose config" and "Database migrations".
# "API integration" and "Compose smoke" are non-required until they have been stable for a while;
# "Compose smoke" runs the full dev-stack lifecycle plus the end-to-end auth smoke.
# Do not rename these jobs' `name:` without updating branch protection.
# Local equivalents are documented in README.md -> "Continuous integration".
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  FORCE_COLOR: '1'
  # n8n release the smoke test runs; the package README must state the same version.
  N8N_TESTED_VERSION: '2.43.8'

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: typecheck
      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: test
      - name: Test
        run: pnpm test

  n8n-node:
    name: n8n community node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: n8n-node
      - name: Build
        run: pnpm --filter @feedbouncer/n8n-nodes-feedbouncer build
      - name: Lint
        run: pnpm --filter @feedbouncer/n8n-nodes-feedbouncer lint
      - name: Typecheck
        run: pnpm --filter @feedbouncer/n8n-nodes-feedbouncer typecheck
      - name: Test
        run: pnpm --filter @feedbouncer/n8n-nodes-feedbouncer test
      - name: Install smoke test (real n8n image)
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          pnpm --filter @feedbouncer/n8n-nodes-feedbouncer pack --pack-destination "$pack_dir"
          node integrations/n8n-nodes-feedbouncer/scripts/smoke.mjs "$pack_dir"/*.tgz "$N8N_TESTED_VERSION"
      - name: n8n node PRs must not change product code
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # HEAD is the PR merge commit, so BASE_SHA..HEAD is exactly this PR's change.
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" HEAD | node scripts/ci/n8n-scope-guard.mjs

  docker-discover:
    name: Docker discover
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.discover.outputs.targets }}
      has_targets: ${{ steps.discover.outputs.has_targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: discover
        name: Find Dockerfiles
        run: node scripts/ci/docker-targets.mjs

  docker-image:
    name: Docker image (${{ matrix.name }})
    needs: docker-discover
    if: needs.docker-discover.outputs.has_targets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.docker-discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        name: Read Node version from .nvmrc
        run: |
          version="$(tr -d '[:space:]' < .nvmrc)"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error file=.nvmrc::expected a numeric Node version, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          outputs: type=cacheonly
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Stable required check. Green when every image built OR there are no
  # Dockerfiles; red if discovery or any image failed.
  docker-build:
    name: Docker build
    needs: [docker-discover, docker-image]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize Docker results
        env:
          DISCOVER_RESULT: ${{ needs.docker-discover.result }}
          HAS_TARGETS: ${{ needs.docker-discover.outputs.has_targets }}
          IMAGE_RESULT: ${{ needs.docker-image.result }}
        run: |
          set -euo pipefail
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "::error::Docker target discovery ended with: $DISCOVER_RESULT"
            exit 1
          fi
          case "$IMAGE_RESULT" in
            success)
              echo "All Docker images built." ;;
            skipped)
              if [ "$HAS_TARGETS" = "true" ]; then
                echo "::error::Dockerfiles were found but no image was built."
                exit 1
              fi
              echo "No Dockerfiles in apps/* or packages/*; nothing to build." ;;
            *)
              echo "::error::At least one Docker image build ended with: $IMAGE_RESULT"
              exit 1 ;;
          esac

  compose-config:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate compose files with the example env
        run: |
          set -euo pipefail
          docker compose version
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.expose-db.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.override.example.yaml config --quiet
      - name: Missing env must fail loudly
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/empty.env"
          if docker compose --env-file "$RUNNER_TEMP/empty.env" config --quiet 2> "$RUNNER_TEMP/err.txt"; then
            echo "::error::compose config succeeded without required variables"
            exit 1
          fi
          cat "$RUNNER_TEMP/err.txt"
          grep -q 'copy .env.example to .env' "$RUNNER_TEMP/err.txt"

  db-migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: feedbouncer
          POSTGRES_PASSWORD: dev-only-ci-postgres
          POSTGRES_DB: feedbouncer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U feedbouncer -d feedbouncer"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Throwaway service container on an ephemeral runner; not a secret.
      DATABASE_URL: postgresql://feedbouncer:dev-only-ci-postgres@127.0.0.1:5432/feedbouncer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: db-migrations
      - name: Build the db package and its dependencies
        run: pnpm turbo run build --filter=@feedbouncer/db...
      - name: Apply every migration to the empty database
        run: pnpm --filter @feedbouncer/db migrate:deploy
      - name: Re-run is a no-op
        run: pnpm --filter @feedbouncer/db migrate:deploy
      - name: Roll back the newest migration and re-apply it
        run: |
          set -euo pipefail
          pnpm --filter @feedbouncer/db migrate:down --yes-destroy-data
          pnpm --filter @feedbouncer/db migrate:deploy
      - name: Migration workflow and schema invariant tests
        run: pnpm --filter @feedbouncer/db test:integration

  api-integration:
    name: API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: feedbouncer
          POSTGRES_PASSWORD: dev-only-ci-postgres
          POSTGRES_DB: feedbouncer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U feedbouncer -d feedbouncer"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Throwaway service containers on an ephemeral runner; nothing sensitive.
      DATABASE_URL: postgresql://feedbouncer:dev-only-ci-postgres@127.0.0.1:5432/feedbouncer
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: api-integration
      - name: Build the API and its dependencies
        run: pnpm turbo run build --filter=@feedbouncer/api...
      - name: API integration tests (auth, tenancy, isolation)
        run: pnpm --filter @feedbouncer/api test:integration
      - name: Build the worker and its dependencies
        run: pnpm turbo run build --filter=@feedbouncer/worker...
      - name: Worker operator command integration tests
        run: pnpm --filter @feedbouncer/worker test:integration
      - name: Build connectors and dependencies
        run: pnpm turbo run build --filter=@feedbouncer/connectors...
      - name: Connector framework integration tests (Postgres + Redis conformance, isolation)
        run: pnpm --filter @feedbouncer/connectors test:integration
      - name: Build jobs and dependencies
        run: pnpm turbo run build --filter=@feedbouncer/jobs...
      - name: Job queue integration tests (Postgres + Redis - retries, DLQ, idempotency, crash, isolation)
        run: pnpm --filter @feedbouncer/jobs test:integration
      - name: Build observability and dependencies
        run: pnpm turbo run build --filter=@feedbouncer/observability...
      - name: Observability integration tests
        run: pnpm --filter @feedbouncer/observability test:integration
      - name: Build comments and dependencies
        run: pnpm turbo run build --filter=@feedbouncer/comments...
      - name: Comment store and ingest job integration tests
        run: pnpm --filter @feedbouncer/comments test:integration
      - name: Build evaluation and dependencies
        run: pnpm turbo run build --filter=@feedbouncer/evaluation...
      - name: Evaluation integration tests
        run: pnpm --filter @feedbouncer/evaluation test:integration
      - name: Build public API and dependencies
        run: pnpm turbo run build --filter=@feedbouncer/public-api...
      - name: Public API integration tests
        run: pnpm --filter @feedbouncer/public-api test:integration
      - name: Build webhooks and dependencies
        run: pnpm turbo run build --filter=@feedbouncer/webhooks...
      - name: Webhooks transport integration tests
        run: pnpm --filter @feedbouncer/webhooks test:integration
      - name: Build the MCP server and its dependencies
        run: pnpm turbo run build --filter=@feedbouncer/mcp...
      - name: MCP server end-to-end tests (tenant isolation, prompt injection, stdio)
        run: pnpm --filter @feedbouncer/mcp test:integration

  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The smoke script requires a project name containing "smoke" and
      # every later step uses the same project.
      COMPOSE_PROJECT_NAME: feedbouncer-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          turbo-cache-scope: compose-smoke
      - name: Create .env from the example
        run: cp .env.example .env
      - name: Full lifecycle smoke test
        run: node scripts/dev-stack/smoke.mjs --yes-destroy-local-data
      - name: Start stack for DB integration tests
        # The overlay publishes Postgres on 127.0.0.1 for the tests below only;
        # the smoke above ran against compose.yaml alone.
        env:
          COMPOSE_FILE: compose.yaml:compose.expose-db.yaml
        run: docker compose up -d --wait --wait-timeout 420
      - name: DB integration tests
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:${POSTGRES_HOST_PORT:-5432}/${POSTGRES_DB}"
          pnpm turbo run build --filter=@feedbouncer/db
          pnpm --filter @feedbouncer/db test:integration
      - name: Auth end-to-end smoke
        # Sign-up, email confirmation (via Mailpit), login and tenancy through the web origin.
        run: pnpm stack:auth-smoke
      - name: Container logs on failure
        if: failure()
        env:
          COMPOSE_ENV_FILES: .env.example
        run: docker compose logs --no-color --timestamps --tail 200
      - name: Tear down
        if: always()
        env:
          COMPOSE_ENV_FILES: .env.example
        run: docker compose down -v --remove-orphans
