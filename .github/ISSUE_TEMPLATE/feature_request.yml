name: Feature request
description: Suggest a change or a new capability.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Larger changes (a new connector, a schema change, a new dependency, anything touching auth, secrets or tenancy) start here, before a pull request.
        See https://github.com/feed-bouncer-hq/feed-bouncer/blob/main/CONTRIBUTING.md#proposing-larger-changes
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should FeedBouncer do instead? Include what a user or API client would see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connectors (platform integrations)
        - Moderation rules or AI classification
        - Inbox
        - API or MCP
        - Self-hosting and operations
        - Documentation
        - Other
