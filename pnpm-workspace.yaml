packages:
  - apps/*
  - packages/*
  - integrations/*
allowBuilds:
  '@prisma/engines': true
  cpu-features: false
  esbuild: false
  eslint-plugin-n8n-nodes-base: false
  isolated-vm: false
  msgpackr-extract: false
  prisma: true
  re2: true
  ssh2: false
  unrs-resolver: false
# Releases newer than the minimum age that the n8n build tool pins (reviewed, dev-only).
minimumReleaseAgeExclude:
  - '@n8n/ai-node-sdk@0.33.6'
  - '@n8n/ai-utilities@0.36.6'
  - '@n8n/backend-common@1.43.6'
  - '@n8n/backend-network@1.17.6'
  - '@n8n/config@2.41.4'
  - '@n8n/node-cli@0.52.6'
# Security floors for transitive dependencies of prisma (via better-auth's
# optional peer and packages/db), whose own pins lag the fixes. Selectors only
# match vulnerable versions, so these stop applying once upstream catches up.
overrides:
  'deepmerge-ts@<8.0.0': 8.0.2 # GHSA-ggr8-5vv4-36mx
  'mysql2@<3.23.1': 3.24.5 # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3
  # Same for the dev-only n8n build tool (integrations/n8n-nodes-feedbouncer, not shipped).
  # braces 3.0.3 (GHSA-vfj7-8cjw-p6xm) has no patched release yet.
  'handlebars@<4.7.10': 4.7.10 # GHSA-xw65-4hp5-5hc7, GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f
  'qs@<6.16.0': 6.16.1 # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g
  'stream-json@<3.6.0': 3.7.0 # GHSA-528h-pc64-c93x, GHSA-hqr4-qq8f-hg3x, GHSA-mjw6-4jj6-33hc
  'uuid@<11.1.1': 11.1.1 # GHSA-w5hq-g745-h8pq
  # Optional peer of the n8n build tool's langchain dependency, never used here.
  '@browserbasehq/stagehand': '-'
