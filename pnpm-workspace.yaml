packages:
  - apps/*
  - packages/*
  - integrations/*
allowBuilds:
  '@prisma/engines': true
  cpu-features: false
  esbuild: false
  isolated-vm: false
  msgpackr-extract: false
  prisma: true
  re2: true
  ssh2: false
  unrs-resolver: false
# Security floors for transitive dependencies of prisma (via better-auth's
# optional peer and packages/db), whose own pins lag the fixes. Selectors only
# match vulnerable versions, so these stop applying once upstream catches up.
overrides:
  'deepmerge-ts@<8.0.0': 8.0.2 # GHSA-ggr8-5vv4-36mx
  'mysql2@<3.23.1': 3.24.5 # GHSA-3f6p-5ww8-9rcr, GHSA-rgwj-5xj2-c3m3
